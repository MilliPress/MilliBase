version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "millipress/*"
    ignore:
      - dependency-name: "millipress/millirules"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "pestphp/pest"
        versions: [">=5.0"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # @wordpress/components 34 and @wordpress/element 7 require React 19;
    # WordPress core (and our externalized runtime) is still on React 18.
    # Hold the majors until core ships React 19.
    ignore:
      - dependency-name: "@wordpress/components"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@wordpress/element"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
